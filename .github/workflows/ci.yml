name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://vo:vo@localhost:5432/vo
      BETTER_AUTH_SECRET: ci-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "22"
          cache: true

      - run: vp check
      - run: vp test --passWithNoTests
      - run: vp build
