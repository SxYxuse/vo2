name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so advisories published since the last push still fail the audit.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://vo2:vo2@localhost:5432/vo2
      BETTER_AUTH_SECRET: ci-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "22"
          cache: true

      - run: vp check
      # Knip loads drizzle.config.ts, which validates the environment like db:check does.
      - run: vp run knip
        env:
          STRAVA_MOCK: "1"
      - run: vp run jscpd
      - run: vp run audit
      - run: vp run db:check
        env:
          STRAVA_MOCK: "1"
      - run: vp test run
      - run: vp build
      # Start's Vite plugin writes the route tree; the tsr CLI is not supported for Start
      # (TanStack/router#8437), so the build is the check.
      - name: Committed route tree matches the build
        run: git diff --exit-code -- src/routeTree.gen.ts

      - name: Upload reports for the quality comment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality
          path: jscpd-report/jscpd-report.json
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    outputs:
      report-url: ${{ steps.upload.outputs.artifact-url }}
    env:
      DATABASE_URL: postgresql://vo2:vo2@localhost:5432/vo2
      BETTER_AUTH_SECRET: ci-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
      APP_ENV: development
      STRAVA_MOCK: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vo2
          POSTGRES_PASSWORD: vo2
          POSTGRES_DB: vo2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vo2 -d vo2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "22"
          cache: true

      - run: vp build
      - run: vp run db:migrate
      - run: vp run lighthouse

      # Lighthouse CI still bundles Lighthouse 12, which has no Agentic Browsing category, so
      # Lighthouse 13 scores it separately: reported on the pull request, not asserted.
      - name: Agentic Browsing (Lighthouse 13)
        continue-on-error: true
        run: |
          bun run .output/server/index.mjs &
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:3000/sign-in; do sleep 1; done'
          vp dlx lighthouse@13.6.0 http://localhost:3000/sign-in --only-categories=agentic-browsing \
            --chrome-flags="--headless=new" --output=json \
            --output-path=lighthouse-report/agentic-browsing.json --quiet

      - name: Upload Lighthouse reports
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lighthouse-report/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://vo2:vo2@localhost:5432/vo2
      BETTER_AUTH_SECRET: ci-placeholder-secret
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vo2
          POSTGRES_PASSWORD: vo2
          POSTGRES_DB: vo2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vo2 -d vo2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "22"
          cache: true

      # The browser runs in Playwright's Docker image (playwright.config.ts), so nothing to install.
      - run: vp run e2e

      # Expected, actual, and diff images for every failed screenshot, plus traces.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  # One comment per PR, edited on every push, with the numbers behind the checks.
  report:
    if: always() && github.event_name == 'pull_request'
    needs: [ci, lighthouse, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "22"
          cache: true

      - uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Write the quality report
        run: |
          bun scripts/quality-report.ts reports > quality-report.md
          cat quality-report.md >> "$GITHUB_STEP_SUMMARY"
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          CI_RESULT: ${{ needs.ci.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          LIGHTHOUSE_REPORT_URL: ${{ needs.lighthouse.outputs.report-url }}

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: quality-report
          path: quality-report.md
