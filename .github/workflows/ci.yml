name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://vo2:vo2@localhost:5432/vo2
      BETTER_AUTH_SECRET: ci-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "22"
          cache: true

      - name: Generated route tree is up to date
        run: vp run generate-routes && git diff --exit-code -- src/routeTree.gen.ts
      - run: vp check
      - run: vp run db:check
        env:
          STRAVA_MOCK: "1"
      - run: vp test
      - run: vp build
