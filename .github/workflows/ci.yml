name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so advisories published since the last push still fail the audit.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://vo2:vo2@localhost:5432/vo2
      BETTER_AUTH_SECRET: ci-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "22"
          cache: true

      - name: Generated route tree is up to date
        run: vp run generate-routes && git diff --exit-code -- src/routeTree.gen.ts
      - run: vp check
      - run: vp run knip
      - run: vp run jscpd
      - run: vp run audit
      - run: vp run db:check
        env:
          STRAVA_MOCK: "1"
      - run: vp run coverage
      - run: vp build

  lighthouse:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://vo2:vo2@localhost:5432/vo2
      BETTER_AUTH_SECRET: ci-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
      APP_ENV: development
      STRAVA_MOCK: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vo2
          POSTGRES_PASSWORD: vo2
          POSTGRES_DB: vo2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vo2 -d vo2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "22"
          cache: true

      - run: vp build
      - run: vp run db:migrate
      - run: vp run lighthouse
