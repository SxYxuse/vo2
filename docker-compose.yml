name: vo2

services:
  postgres:
    image: postgres:17-alpine
    container_name: vo2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vo2
      POSTGRES_PASSWORD: vo2
      POSTGRES_DB: vo2
    ports:
      # Not 5432, which other projects on the same machine use. Every checkout shares this
      # container, so VO2_PG_PORT must be the same everywhere (scripts/worktree-env.ts reads it too).
      - "${VO2_PG_PORT:-55432}:5432"
    volumes:
      - vo2-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vo2 -d vo2"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vo2-postgres:
    name: vo2-postgres
