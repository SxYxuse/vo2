services:
  postgres:
    image: postgres:17-alpine
    container_name: vo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vo
      POSTGRES_PASSWORD: vo
      POSTGRES_DB: vo
    ports:
      - "5432:5432"
    volumes:
      - vo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vo -d vo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vo-postgres:
