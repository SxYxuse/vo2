name: vo2

services:
  postgres:
    image: postgres:17-alpine
    container_name: vo2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vo2
      POSTGRES_PASSWORD: vo2
      POSTGRES_DB: vo2
    ports:
      - "5432:5432"
    volumes:
      - vo2-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vo2 -d vo2"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The route builder's bike router (ADR 0062). Opt-in, so `db:up` still starts Postgres only:
  # `vp run routing:up` downloads the map tiles it needs, then starts it. Every checkout shares it.
  brouter:
    profiles: [routing]
    build: ./docker/brouter
    image: vo2-brouter:1.7.10
    container_name: vo2-brouter
    restart: unless-stopped
    ports:
      - "17777:17777"
    volumes:
      - ${HOME}/.cache/vo2/brouter/segments4:/segments4:ro

volumes:
  vo2-postgres:
    name: vo2-postgres
